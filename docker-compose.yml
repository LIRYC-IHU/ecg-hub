# ECG Hub — production stack, HOST networking (Linux only).
#
# Why host networking: ECG Hub listens on many ports (HTTP 4444, FTP + passive
# range, DICOM 4242, ECTP 30003, metrics 9091). Host mode binds every listener
# directly on the host — no port mapping, no NAT — so the backend sees real
# client IPs and FTP passive mode "just works" (PublicHost becomes trivial).
#
# Requirements:
#   - Linux host. `network_mode: host` is a no-op on Docker Desktop (macOS,
#     Windows): the containers get their own network namespace and nothing is
#     reachable. On those machines, see "NON-LINUX HOSTS" below.
#   - Nothing else on the host may already use these ports (80, 443, 4444, the
#     FTP/DICOM/ECTP/metrics ports, and 5432 if Postgres runs on the host).
#   - DATABASE_URL points at the DB as reachable from the host, e.g.
#     postgres://ecghub_user:...@127.0.0.1:5432/ecghub?sslmode=disable
#
# ─── ENVIRONMENT ─────────────────────────────────────────────────────────────
# Every variable the server reads is listed explicitly under `environment:`,
# not pulled in with `env_file:`. That is deliberate: the list documents the
# contract, and a secret injector (Infisical, Vault, SOPS, Kubernetes secrets)
# can provide the values without a .env file existing at all —
#
#   infisical run --env=prod -- docker compose up -d
#
# With plain compose the same names are read from .env in this directory.
# A variable left unset resolves to an empty string; the server fails fast on
# the ones that must not be empty (JWT_SECRET, AUTH_ENCRYPTION_KEY).

services:
  # ─── Bundled PostgreSQL (optional) ─────────────────────────────────────────
  # Comment this service out — and the `depends_on` below, and the
  # `postgres-data` volume — when the site provides its own database (a managed
  # instance, a DBA-run cluster, another host). Then point DATABASE_URL at it.
  #
  # Kept in host networking for consistency with the rest of the stack: the
  # server listens on 127.0.0.1:5432 of the host, which is exactly what the
  # DATABASE_URL above expects. It is NOT exposed to the network by Docker —
  # bind the host's firewall accordingly if the host has a public interface.
  db:
    # From 18 on, the image stores the cluster in a major-version subdirectory
    # (/var/lib/postgresql/18/docker), so the mount moves up one level to
    # /var/lib/postgresql. That is what makes a later "pg_upgrade --link"
    # possible without crossing a mount boundary.
    #
    # UPGRADING AN EXISTING INSTALL: do not point this at a volume that already
    # holds a 16 cluster. 18 cannot open it, so it initialises an empty one —
    # the stack comes up healthy and the application starts against a blank
    # database while the old data sits untouched in the volume. Dump first,
    # start 18 on a fresh volume, restore, and keep the old volume until the
    # row counts check out: docs/POSTGRES_UPGRADE.md.
    image: postgres:18.6-alpine
    network_mode: host
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${DB_NAME:-ecghub}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # Host networking: postgres binds the host's :5432. Change it here and in
      # DATABASE_URL if that port is already taken on the machine.
      PGPORT: ${DB_PORT:-5432}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME:-ecghub}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    network_mode: host
    restart: unless-stopped
    # Remove this block together with the `db` service when using an external
    # database — otherwise compose waits for a service that no longer exists.
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    # Hardening (NFR-S1): drop all Linux capabilities, forbid privilege escalation.
    cap_drop:
      - ALL
    # ─── FTP ON THE PRIVILEGED PORT 21 ──────────────────────────────────────
    # The default FTP/DICOM/ECTP ports are all > 1024, so the hardened defaults
    # above are enough. Some ECG devices (Nihon Kohden) can only send to port
    # 21, and the app runs as a non-root user, so binding it takes THREE
    # changes together -- any one alone fails with "permission denied":
    #
    #   1. the image stamps cap_net_bind_service on the binary (already done in
    #      backend/Dockerfile; `cap_add` alone only widens the bounding set and
    #      grants a non-root process nothing),
    #   2. uncomment the `cap_add` below so the capability is in the bounding
    #      set at all,
    #   3. comment out `no-new-privileges` above -- it blocks file capabilities
    #      at execve, which is exactly how the binary would pick this one up.
    #
    # Then set the FTP port to 21 in Admin > Modules > FTP.
    #
    # Prefer NOT doing any of this: a host-side redirect keeps the container
    # fully hardened and needs no rebuild --
    #   iptables -t nat -A PREROUTING -p tcp --dport 21 -j REDIRECT --to-port 2121
    # Only the control channel is redirected; the passive range is advertised
    # directly, so FTPS is unaffected.
    #
    # cap_add:
    #   - NET_BIND_SERVICE
    environment:
      # ─── Required ────────────────────────────────────────────────────────
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY}
      # Anything other than development/dev/test/local means production, which
      # is where the weak-secret checks are enforced. Leave it unset in prod.
      APP_ENV: ${APP_ENV}
      # ─── Optional ────────────────────────────────────────────────────────
      # Public origin (https://ecg.chu.example). Used for CORS and for the
      # absolute callback links inside webhook payloads.
      HOST_URL: ${HOST_URL}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CONFIG_PATH: ${CONFIG_PATH:-/app/config.yaml}
      # ─── Metrics ─────────────────────────────────────────────────────────
      # Both override the `metrics:` section of config.yaml, so a deployment
      # can turn the Prometheus endpoint on or move it without templating the
      # mounted file. Unset here → whatever config.yaml says.
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      METRICS_PORT: ${METRICS_PORT:-9091}
      # ─── TLS for the device-facing servers (FTPS, DICOM TLS) ─────────────
      # The certificate is read from the mounted ./certs directory, so renewal
      # stays with whoever already does it (certbot, internal PKI): the files
      # are rewritten in place and the module is restarted. Defaults match
      # certbot's names, so mounting /etc/letsencrypt/live/<host> needs nothing
      # here. Override only for a different layout.
      TLS_CERT_FILE: ${TLS_CERT_FILE:-/certs/fullchain.pem}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-/certs/privkey.pem}
      # ─── Object storage (optional) ───────────────────────────────────────
      # STORAGE_BACKEND=s3 turns it on. Files are still written to the local
      # volume first and uploaded from there, so keep the volume mounted and
      # sized for the longest bucket outage you are willing to ride out.
      # Leave STORAGE_BACKEND unset (or "local") to store on disk only.
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_PREFIX: ${S3_PREFIX:-}
      # MinIO/RustFS/Ceph need path-style addressing; AWS accepts either.
      S3_PATH_STYLE: ${S3_PATH_STYLE:-true}
      # Credentials — inject them, never write them here.
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      # ─── Webhooks ────────────────────────────────────────────────────────
      # Delivery-history retention in days. 0 keeps every delivery forever;
      # unset means 30. Each row holds the full payload, patient identifiers
      # included, so this is a data-retention decision as much as a disk one.
      WEBHOOKS_RETENTION_DAYS: ${WEBHOOKS_RETENTION_DAYS:-30}
    volumes:
      # Certificates for FTPS and DICOM TLS, managed outside the app.
      # Point the left side at /etc/letsencrypt/live/<host> to use certbot directly.
      - ./certs:/certs:ro
      - ./config.yaml:/app/config.yaml:ro
      - ecg-storage:/data/ecg
      - ecg-quarantine:/data/ecg-quarantine
    # ─── NON-LINUX HOSTS ────────────────────────────────────────────────────
    # Under `network_mode: host` Docker ignores `ports:` — publishing them here
    # would do nothing on Linux and hide the fact that the mode is what binds
    # the listeners. On Docker Desktop (macOS, Windows) host mode does not work
    # at all: remove `network_mode: host` from this service AND from frontend,
    # then uncomment the block below and switch nginx to the bridge config
    # (nginx.conf, upstream backend:4444, instead of nginx.host.conf).
    #
    # FTP passive mode then needs the advertised host set to the machine's LAN
    # address in Admin > Modules > FTP, and the passive range must match.
    #
    # ports:
    #   - "4444:4444"                       # HTTP API (nginx upstream)
    #   - "${FTP_PORT:-2121}:2121"          # FTP control
    #   - "${DICOM_PORT:-4242}:4242"        # DICOM C-STORE
    #   - "30003:30003"                     # ECTP (Nihon Kohden)
    #   - "30000-30002:30000-30002"         # FTP passive range, split around ECTP
    #   - "30004-30010:30004-30010"         # FTP passive range
    #   - "${METRICS_PORT:-9091}:9091"      # Prometheus scrape

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    network_mode: host
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # nginx master starts as root: it binds :80, chowns its cache/temp dirs and
    # drops privileges to the unprivileged `nginx` user. With `cap_drop: ALL`
    # these would fail, so grant back exactly the capabilities it needs at boot.
    cap_add:
      - NET_BIND_SERVICE # bind the privileged port 80
      - CHOWN # chown cache/temp dirs to the nginx user
      - SETUID # drop worker processes to uid nginx
      - SETGID # drop worker processes to gid nginx
      - DAC_OVERRIDE # write pid/cache regardless of dir perms
    volumes:
      # Host-mode nginx (upstream = 127.0.0.1:4444, no Docker DNS resolver).
      # TLS is terminated by an external Traefik that forwards HTTP to :80, so
      # no certificates are mounted here.
      - ./nginx.host.conf:/etc/nginx/conf.d/default.conf:ro
    # On a non-Linux host, drop `network_mode: host` above and publish instead:
    # ports:
    #   - "80:80"

volumes:
  ecg-storage:
  ecg-quarantine:
  # Only needed with the bundled `db` service — remove it with the service.
  postgres-data:
