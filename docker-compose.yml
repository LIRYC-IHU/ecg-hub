services:
  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_DB: ecghub
  #     POSTGRES_USER: ${DB_USER}
  #     POSTGRES_PASSWORD: ${DB_PASSWORD}
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ecghub"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    # Hardening (NFR-S1): drop all Linux capabilities and forbid privilege escalation.
    # FTP/DICOM bind non-privileged ports (>1024), so no capability is needed.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # read_only root FS is recommended but commented until export/converter temp
    # write paths are confirmed. To enable: uncomment and provide tmpfs for /tmp.
    # read_only: true
    # tmpfs:
    #   - /tmp
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ecg-storage:/data/ecg
      - ecg-quarantine:/data/ecg-quarantine
    expose:
      - "4444"
    ports:
      - "2121:2121"
      - "30000-30010:30000-30010"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # TLS certificates — required by nginx.conf (production TLS termination).
      # Drop your certificate + key here, or point to your PKI-managed paths.
      - ./certs/server.crt:/etc/nginx/certs/server.crt:ro
      - ./certs/server.key:/etc/nginx/certs/server.key:ro

volumes:
  # postgres-data:
  # IT: to use an external pre-created volume, replace with:
  #   ecg-storage:
  #     external: true
  #     name: my-ecg-volume
  ecg-storage:
  ecg-quarantine:
