# ECG Hub — production stack, bridge networking.
#
# Every variable is listed explicitly under `environment:` rather than pulled in
# with `env_file:`, so a secret injector can supply the values with no .env file:
#   infisical run --env=prod -- docker compose up -d
#
# Published ports are fixed here. A module port changed in Admin > Modules must
# be changed on the container side of the mapping too, or nothing reaches it.

services:
  # Bundled PostgreSQL. Comment out this service, the `depends_on` below and the
  # `postgres-data` volume when the site provides its own database.
  db:
    # 18 stores the cluster in /var/lib/postgresql/18/docker, so the mount sits
    # one level up. 18 cannot open a 16 cluster and silently initialises an empty
    # one instead: dump and restore first — docs/POSTGRES_UPGRADE.md.
    image: postgres:18.6-alpine
    restart: unless-stopped
    networks: [ecg-hub]
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${DB_NAME:-ecghub}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME:-ecghub}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [ecg-hub]
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      # Devices that cannot be told which port to use (Nihon Kohden) need FTP on
      # 21. Docker publishes it as root, so the container keeps binding 2121 as a
      # non-root user and needs no capability.
      - "${FTP_PORT:-21}:2121"
      - "${DICOM_PORT:-4242}:4242"
      - "30003:30003" # ECTP (Nihon Kohden)
      # FTP passive range, split around ECTP. Must match Admin > Modules > FTP.
      - "30000-30002:30000-30002"
      - "30004-30010:30004-30010"
      # Prometheus scrape, loopback only. Drop the 127.0.0.1 prefix to expose it.
      - "127.0.0.1:${METRICS_PORT:-9091}:9091"
    environment:
      # ─── Required ────────────────────────────────────────────────────────
      # postgres://ecghub_user:...@db:5432/ecghub?sslmode=disable
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY}
      # Anything but development/dev/test/local means production, where the
      # weak-secret checks are enforced. Leave unset in prod.
      APP_ENV: ${APP_ENV}
      # ─── Optional ────────────────────────────────────────────────────────
      # Public origin (https://ecg.chu.example): CORS, and webhook callback links.
      HOST_URL: ${HOST_URL}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CONFIG_PATH: ${CONFIG_PATH:-/app/config.yaml}
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      METRICS_PORT: ${METRICS_PORT:-9091}
      # FTPS and DICOM TLS. Defaults match certbot's filenames, so mounting
      # /etc/letsencrypt/live/<host> at /certs needs nothing here.
      TLS_CERT_FILE: ${TLS_CERT_FILE:-/certs/fullchain.pem}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-/certs/privkey.pem}
      # ─── Object storage (optional) ───────────────────────────────────────
      # STORAGE_BACKEND=s3 turns it on. Files are written to the local volume
      # first and uploaded from there, so keep the volume sized for the longest
      # bucket outage worth riding out. Unset (or "local") stores on disk only.
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_PREFIX: ${S3_PREFIX:-}
      # MinIO/RustFS/Ceph need path-style addressing; AWS accepts either.
      S3_PATH_STYLE: ${S3_PATH_STYLE:-true}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      # Delivery-history retention in days; 0 keeps every delivery forever. Each
      # row holds the full payload, patient identifiers included.
      WEBHOOKS_RETENTION_DAYS: ${WEBHOOKS_RETENTION_DAYS:-30}
    volumes:
      # Certificates managed outside the app. Point the left side at
      # /etc/letsencrypt/live/<host> to use certbot directly.
      - ./certs:/certs:ro
      - ./config.yaml:/app/config.yaml:ro
      - ecg-storage:/data/ecg
      - ecg-quarantine:/data/ecg-quarantine

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [ecg-hub]
    depends_on:
      - backend
    ports:
      - "80:80"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # nginx starts as root to bind :80 and chown its cache dirs, then drops to
    # the unprivileged nginx user. cap_drop: ALL breaks all of that, so grant
    # back exactly what it needs.
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    volumes:
      # Upstream backend:4444 over the Docker network. TLS is terminated by an
      # external Traefik that forwards plain HTTP here.
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  ecg-hub:
    driver: bridge

volumes:
  ecg-storage:
  ecg-quarantine:
  # Only needed with the bundled `db` service.
  postgres-data:
