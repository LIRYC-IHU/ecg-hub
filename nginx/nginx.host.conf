# ECG Hub — production, host networking (docker-compose.host.yml).
#
# Same as nginx.conf except for the upstream: sharing the host namespace, the
# backend is reachable on loopback rather than by service name, and there is no
# Docker DNS to resolve one — so the embedded resolver is gone too.
#
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 http2;
    http2 on;
    server_name _;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;


    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to the Go backend.
    # Full path is preserved — backend routes are mounted at /api/v1/...
    location /api/ {
        set $backend "127.0.0.1:4444";
        proxy_pass http://$backend;
        proxy_set_header Host $host;

        # Client identity headers — required by the backend's per-IP login rate
        # limiting / lockout (c.RealIP()) and the cookie Secure flag (c.Scheme()).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade — required for export progress (/api/v1/exports/:id/ws).
        proxy_http_version 1.1;
        # Long-lived server streams (EventService.Subscribe) must reach the
        # browser frame by frame. With buffering on, nginx holds the response
        # until the handler returns — which for a stream is never — so the
        # upload page waits, times out and leaves its rows on "processing".
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
    }
    
    # gRPC → backend Go (h2c). A gRPC client sends the fully-qualified method
    # as the path (/<package>.<Service>/<Method>), e.g.
    # /grpc.api.v1.HealthzService/CheckHealth — so we match the package prefix,
    # NOT an invented /grpc/ prefix (a gRPC client can't add one).
    location /grpc.api.v1. {
        set $backend "127.0.0.1:4444";
        grpc_pass grpc://$backend;
    }

    # Downloads — no cache to prevent 304 on blob fetch
    location ~ ^/api/v1/ecgs/.+/download {
        set $backend "127.0.0.1:4444";
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache" always;
        add_header Pragma "no-cache" always;
    }

    # React SPA — all other routes fall back to index.html.
    # CSP is applied here (HTML), NOT on /api/. 
    # nginx note: an add_header in a location replaces all parent add_headers,
    # so HSTS is re-declared here to keep it on SPA responses.
    location / {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
