# Scrape config for the observability overlay (docker-compose.metrics.yml).
# Targets are compose service names, resolved over the ecg-hub Docker network.

global:
  # 15s is the dashboard's assumed resolution. Benchmarks read rates over short
  # windows, so a coarser interval would flatten exactly the peaks being measured.
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: ecg-hub
    static_configs:
      - targets: ["backend:9091"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
