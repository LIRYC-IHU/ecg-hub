basePath: /api/v1
host: localhost
info:
  contact:
    name: LIRYC-IHU
    url: https://www.ihu-liryc.fr
  description: API for ECG file ingestion, storage, conversion, and clinical workflow
    management.
  title: ECG Hub API
  version: "1.0"
paths:
  /api/v1/ecgs/{id}:
    delete:
      parameters:
      - description: ECG UUID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete ECG
      tags:
      - ECG
  /api/v1/ecgs/{id}/download:
    get:
      parameters:
      - description: ECG UUID
        in: path
        name: id
        required: true
        type: string
      - description: Export format — repeat the parameter to receive a ZIP bundle
          (e.g. ?format=original&format=xmlfda)
        enum:
        - original
        - xmlfda
        - dicom
        in: query
        name: format
        type: string
      - description: Strip patient-identifying fields from converted outputs (research
          use). Mutually exclusive with inject; converted formats only.
        in: query
        name: anonymize
        type: boolean
      - description: Overwrite patient fields in converted outputs with the HL7-enriched
          demographics from the HIS. Mutually exclusive with anonymize; converted
          formats only.
        in: query
        name: inject
        type: boolean
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: BAD_OPTIONS — invalid anonymize/inject combination
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Download ECG file
      tags:
      - ECG
  /api/v1/ecgs/{id}/view:
    post:
      description: Stamps viewed_at on first view; clears the "new" indicator. Idempotent.
      parameters:
      - description: ECG UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Mark an ECG as viewed
      tags:
      - ECG
  /api/v1/uploads:
    post:
      consumes:
      - multipart/form-data
      description: |-
        Push one or more ECG files into the ingestion pipeline (same as FTP/DICOM).
        Accessible with an API key (X-API-Key header) so offline/isolated devices and
        scripts can submit files without an interactive login. Requires the ecg.upload
        permission on the key's role. Valid files are stored, files without a patient ID
        go to the unidentified review queue, invalid files are rejected.
      parameters:
      - description: ECG files (repeat the field for multiple)
        in: formData
        name: files
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      - ApiKeyAuth: []
      summary: Upload ECG files manually (offline/isolated devices)
      tags:
      - uploads
securityDefinitions:
  ApiKeyAuth:
    description: Per-user API key ("ecghub_…") created from the API Keys page. Inherits
      the owning user's role and permissions — intended for machine clients such as
      webhook receivers fetching ECG files.
    in: header
    name: X-API-Key
    type: apiKey
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
