syntax = "proto3";
package grpc.api.v1;

// Current authenticated user — identity, role and resolved permissions. Used by
// the frontend on every page load. Protected: requires a valid session.
message GetCurrentUserRequest {}

message GetCurrentUserResponse {
  string user_id = 1;             // stable internal uuid — keys per-user resources
  string username = 2;            // human-readable identifier (display)
  string role = 3;
  repeated string permissions = 4;
  string provider = 5;            // "local", "oidc", "ldap" — only local accounts own a password
}

// ChangePassword updates the caller's own password. Self-service: authenticated
// by the session, not by a permission. Rejected for accounts whose credentials
// live in an identity provider.
message ChangePasswordRequest {
  string current_password = 1;
  string new_password = 2;
}

message ChangePasswordResponse {}

service SessionService {
  rpc GetCurrentUser(GetCurrentUserRequest) returns (GetCurrentUserResponse) {}
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse) {}
}
