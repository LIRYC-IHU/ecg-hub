syntax = "proto3";
package grpc.api.v1;

// Public branding shown on the login and setup pages.
message GetBrandingRequest {}

message GetBrandingResponse {
  string center_name = 1;
  string logo_base64 = 2;
}

service BrandingService {
  rpc GetBranding(GetBrandingRequest) returns (GetBrandingResponse) {}
}
