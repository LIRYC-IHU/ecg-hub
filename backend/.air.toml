# air (hot reload) — used by Dockerfile.dev only.
root = "."
# Outside /app on purpose: /app is the bind mount, and build artefacts written
# there would land in the working tree.
tmp_dir = "/tmp/air"

[build]
cmd = "go build -o /tmp/air/ecg-hub ./cmd/ecg-hub"
bin = "/tmp/air/ecg-hub"
include_ext = ["go", "tmpl", "html", "yaml", "sql"]
exclude_dir = ["converter-fda", "loadtest", "v1", "tmp"]
exclude_regex = ["_test\\.go"]
delay = 500
stop_on_error = true

[log]
time = true
