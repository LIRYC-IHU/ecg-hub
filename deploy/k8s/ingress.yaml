# Pas de bloc tls : Traefik sert le wildcard *.waxmaker.fr via son TLSStore,
# comme pour les autres applications du cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecg-hub
  namespace: ecg-hub
spec:
  rules:
    - host: ecg-k8s.waxmaker.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
