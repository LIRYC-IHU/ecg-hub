# Nom imposé : nginx proxifie vers « backend:4444 », en dur dans sa
# configuration. Renommer ce Service casse l'interface.
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: ecg-hub
spec:
  selector:
    app: backend
  ports:
    - { name: http, port: 4444, targetPort: 4444 }
    - { name: metrics, port: 9091, targetPort: 9091 }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ecg-hub
spec:
  selector:
    app: frontend
  ports:
    - { name: http, port: 80, targetPort: 80 }
