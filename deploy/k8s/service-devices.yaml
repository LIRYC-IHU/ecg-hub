# Services appareils — couche 4, jamais d'Ingress.
#
# Pourquoi LoadBalancer et pas NodePort : la plage NodePort par défaut d'un
# cluster est 30000-32767, ce qui exclut 21 et 4242. Or les électrocardiographes
# Nihon Kohden composent le 21 et ne sont pas paramétrables. MetalLB fournit un
# vrai LoadBalancer ici, donc le problème ne se pose pas.
#
# L'adresse est FIGÉE dans la plage MetalLB (10.10.50.100-150, .100 étant pris
# par Traefik). Les appareils sont configurés à la main avec cette adresse : la
# laisser flotter imposerait de repasser sur chaque appareil.
#
# externalTrafficPolicy: Local préserve l'adresse source de l'appareil. C'est la
# seule identité du client enregistrée dans la traçabilité d'ingestion, le
# filtrage par adresse MAC étant hors d'atteinte dans ce namespace. Effet de
# bord utile avec MetalLB en L2 : l'adresse n'est annoncée que depuis le nœud
# qui porte le pod.
#
# APRÈS DÉPLOIEMENT, dans Administration > Modules :
#   FTP    port 2121, Public host 10.10.50.101, Public port 21,
#          plage passive 30000-30100
#   DICOM  port 4242
#   ECTP   port 30003
#
# La plage passive doit correspondre EXACTEMENT à celle déclarée ci-dessous : le
# serveur annonce un port dans sa réponse 227, et un port non publié fait échouer
# le transfert juste après.
#
# Sa largeur est le plafond de transferts simultanés — un port est retenu par
# connexion de données en cours. Alignée sur la production (30000-30100).
# La modifier ici ET dans Administration > Modules.
#
# 30003 est retiré de la liste : ECTP l'occupe, et un port dupliqué fait refuser
# le Service par l'API. Le serveur FTP, trouvant 30003 pris, passe au suivant.
apiVersion: v1
kind: Service
metadata:
  name: devices
  namespace: ecg-hub
  annotations:
    # spec.loadBalancerIP est déprécié depuis Kubernetes 1.24 et MetalLB prévoit
    # de le retirer : l'annotation est la forme à utiliser.
    metallb.io/loadBalancerIPs: 10.10.50.101
    metallb.io/address-pool: default
spec:
  type: LoadBalancer
  # MetalLB route l'IP du LoadBalancer directement vers les pods : les NodePort
  # ne servent à rien ici, et 103 ports en consommeraient autant dans la plage
  # NodePort (30000-32767).
  allocateLoadBalancerNodePorts: false
  externalTrafficPolicy: Local
  selector:
    app: backend
  ports:
    - { name: ftp-ctl, port: 21, targetPort: 2121 }
    - { name: dicom, port: 4242, targetPort: 4242 }
    - { name: ectp, port: 30003, targetPort: 30003 }
    # Inbound HL7 ADT (IHE RAD-12). Décommenter après avoir activé adt dans
    # config.yaml — c'est un chemin d'écriture dans l'identité patient, atteint
    # par le réseau.
    # - { name: adt, port: 2576, targetPort: 2576 }
    # Plage passive FTP.
    - { name: pasv-30000, port: 30000, targetPort: 30000 }
    - { name: pasv-30001, port: 30001, targetPort: 30001 }
    - { name: pasv-30002, port: 30002, targetPort: 30002 }
    - { name: pasv-30004, port: 30004, targetPort: 30004 }
    - { name: pasv-30005, port: 30005, targetPort: 30005 }
