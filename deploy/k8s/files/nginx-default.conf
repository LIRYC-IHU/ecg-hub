# nginx.conf du frontend, adapté à Kubernetes.
#
# DEUX divergences avec nginx/nginx.conf à la racine du dépôt, toutes deux
# indispensables, et qui échouent de la même façon : 502 sur chaque appel API
# alors que le backend est parfaitement sain.
#
# 1. La directive resolver. En Docker Compose, nginx interroge 127.0.0.11, le
#    DNS embarqué de Docker. Cette adresse n'existe pas dans un pod Kubernetes.
#    Comme proxy_pass passe par une variable ($backend), nginx résout le nom à
#    chaque requête et a donc besoin d'un resolver.
#
# 2. Le nom pleinement qualifié du Service. nginx utilisant la directive
#    resolver n'applique PAS les domaines de recherche de /etc/resolv.conf : le
#    nom court « backend » suffit au DNS de Docker, mais CoreDNS répond
#    NXDOMAIN, et nginx journalise « backend could not be resolved (3: Host not
#    found) ». D'où backend.ecg-hub.svc.cluster.local.
#
#    Ce nom contient le namespace : déployer ailleurs que dans « ecg-hub »
#    impose de le changer ici.
#
# 10.96.0.10 est le ClusterIP du Service kube-dns de ce cluster
# (kubectl -n kube-system get svc kube-dns). À ajuster sur un autre cluster.
#
# Toute modification de nginx/nginx.conf doit être reportée ici.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 http2;
    http2 on;
    server_name _;

    resolver 10.96.0.10 valid=5s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # Les fichiers ECG et les exports sont volumineux.
    client_max_body_size 512m;

    location /api/ {
        set $backend "backend.ecg-hub.svc.cluster.local:4444";
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
    }

    # gRPC/Connect vers le backend en h2c.
    location ~ ^/(ecghub|grpc)\. {
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        set $backend "backend.ecg-hub.svc.cluster.local:4444";
        grpc_pass grpc://$backend;
    }

    location /healthz {
        set $backend "backend.ecg-hub.svc.cluster.local:4444";
        proxy_pass http://$backend;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
