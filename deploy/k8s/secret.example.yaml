# Modèle. NE PAS COMMITER de valeurs réelles.
#
#   cp secret.example.yaml secret.yaml   puis remplir, puis
#   kubectl apply -f secret.yaml
#
# secret.yaml est ignoré par git (voir .gitignore de ce répertoire).
#
# Génération :
#   JWT_SECRET            openssl rand -base64 48
#   AUTH_ENCRYPTION_KEY   openssl rand -base64 32
#
# AVERTISSEMENT : la perte de AUTH_ENCRYPTION_KEY rend illisible tout secret
# déjà enregistré en base (identifiants LDAP/OIDC, identifiants de modules).
# À sauvegarder avec la base, et à conserver ailleurs qu'à côté d'elle.
apiVersion: v1
kind: Secret
metadata:
  name: ecg-hub
  namespace: ecg-hub
type: Opaque
stringData:
  # La VM Postgres (10.10.50.40) est exposée dans le cluster par un Service sans
  # selector dans le namespace "default" — d'où le nom pleinement qualifié.
  DATABASE_URL: "postgres://ecghub_user:CHANGEME@postgres.default.svc.cluster.local:5432/ecghub?sslmode=disable"
  JWT_SECRET: "CHANGEME"
  AUTH_ENCRYPTION_KEY: "CHANGEME"
