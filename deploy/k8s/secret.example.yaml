# Modèle. NE PAS COMMITER de valeurs réelles.
#
#   cp secret.example.yaml secret.yaml   puis remplir, puis
#   kubectl apply -f secret.yaml
#
# secret.yaml est ignoré par git (voir .gitignore de ce répertoire).
#
# Génération :
#   JWT_SECRET            openssl rand -base64 48
#   AUTH_ENCRYPTION_KEY   openssl rand -base64 32
#
# AVERTISSEMENT : la perte de AUTH_ENCRYPTION_KEY rend illisible tout secret
# déjà enregistré en base (identifiants LDAP/OIDC, identifiants de modules).
# À sauvegarder avec la base, et à conserver ailleurs qu'à côté d'elle.
apiVersion: v1
kind: Secret
metadata:
  name: ecg-hub
  namespace: ecg-hub
type: Opaque
stringData:
  # La VM Postgres (10.10.50.40) est exposée dans le cluster par un Service sans
  # selector dans le namespace "default" — d'où le nom pleinement qualifié.
  # Le nom de la base vient du terraform qui la cree (POSTGRES_DB) -- le verifier
  # plutot que le supposer : une base absente ne se voit qu'au demarrage, en
  # SQLSTATE 3D000, apres que le pod a l'air parti correctement.
  DATABASE_URL: "postgres://ecghub_user:CHANGEME@postgres.default.svc.cluster.local:5432/ecg_hub?sslmode=disable"
  JWT_SECRET: "CHANGEME"
  AUTH_ENCRYPTION_KEY: "CHANGEME"
  # Mode S3 uniquement. Les identifiants ne sont lus que depuis l'environnement,
  # jamais depuis config.yaml, qui est un ConfigMap en clair. Supprimer ces deux
  # lignes en mode local : le Deployment les declare optional.
  S3_ACCESS_KEY: "CHANGEME"
  S3_SECRET_KEY: "CHANGEME"
