apiVersion: v1
kind: ConfigMap
metadata:
  name: ecg-hub-config
  labels:
    {{- include "ecg-hub.labels" . | nindent 4 }}
data:
  config.yaml: |-
    {{- include "ecg-hub.config" . | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ecg-hub-nginx
  labels:
    {{- include "ecg-hub.labels" . | nindent 4 }}
data:
  default.conf: |-
    {{- .Files.Get "files/nginx-default.conf" | nindent 4 }}
