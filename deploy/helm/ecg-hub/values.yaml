# Valeurs par défaut, génériques. Les valeurs d'un site (registry, hôte,
# adresses, stockage) vont dans un fichier à part, non suivi par git :
#   helm upgrade --install ecg-hub . -n ecg-hub -f values.local.yaml
# Voir README.md.

# Pas de Namespace dans le chart : Helm enregistre la release dans le namespace
# avant de créer quoi que ce soit, un chart ne peut donc pas créer le sien.
# --create-namespace, kubectl, ou ArgoCD (CreateNamespace +
# managedNamespaceMetadata pour les libellés PodSecurity). Voir README.md.

# Secret de pull, si le registry exige une authentification. Créé à part :
#   kubectl -n ecg-hub create secret docker-registry regcred \
#     --docker-server=<registry> \
#     --docker-username=<utilisateur> --docker-password=<mot de passe>
# puis :
#   imagePullSecrets:
#     - name: regcred
imagePullSecrets: []

# Secret applicatif : DATABASE_URL, JWT_SECRET, AUTH_ENCRYPTION_KEY, et en mode
# S3 S3_ACCESS_KEY / S3_SECRET_KEY.
#
# Par défaut le chart ne le crée PAS : des secrets dans values.yaml finissent
# dans git ou dans l'historique Helm. Le créer à part (kubectl, sealed-secrets,
# external-secrets) sous le nom `secret.name`.
#
# create: true + values passées en --set ou dans un fichier non suivi, pour un
# essai seulement.
#
# Génération :
#   JWT_SECRET            openssl rand -base64 48
#   AUTH_ENCRYPTION_KEY   openssl rand -base64 32
# La perte de AUTH_ENCRYPTION_KEY rend illisible tout secret déjà enregistré en
# base. À sauvegarder avec la base, et ailleurs qu'à côté d'elle.
secret:
  name: ecg-hub
  create: false
  values: {}
  #   DATABASE_URL: "postgres://<utilisateur>:<mot de passe>@<hôte>:5432/<base>?sslmode=disable"
  #   JWT_SECRET: ""
  #   AUTH_ENCRYPTION_KEY: ""
  #   S3_ACCESS_KEY: ""
  #   S3_SECRET_KEY: ""

# Contenu de config.yaml. Vide : files/config.yaml du chart.
# Ne contient que l'infrastructure — modules, HL7, connecteurs, webhooks et
# authentification se configurent dans l'interface et vivent en base.
config: ""

backend:
  image:
    # Aucune image n'est publiée : construire et pousser dans votre registry.
    repository: registry.example.com/ecg-hub/backend
    tag: "1.1.1"
    pullPolicy: IfNotPresent

  # 1, et pas par prudence excessive :
  #   - les appareils poussent vers une adresse unique, sans découverte ;
  #   - le pipeline d'ingestion vit en mémoire dans le processus ;
  #   - une connexion de contrôle FTP et sa connexion de données doivent
  #     atteindre le même pod — à 2, un transfert passif sur deux échoue.
  # La stratégie est Recreate (volume ReadWriteOnce, transferts en cours).
  replicas: 1

  # URL publique de l'interface (liens dans les e-mails, redirections OIDC).
  hostUrl: https://ecg-hub.example.com
  logLevel: info

  metrics:
    enabled: true
    port: 9091

  # Variables supplémentaires. NE PAS y mettre STORAGE_BACKEND / S3_* vides :
  # le loader les lit avec os.LookupEnv, une variable déclarée vide écrase la
  # valeur de config.yaml. Le stockage se règle dans `config`.
  extraEnv: []

  # Laisse un transfert en cours se terminer : arrêt des modules d'ingestion,
  # puis vidage du serveur HTTP en 15 s.
  terminationGracePeriodSeconds: 120

  # Le DAT recommande 2Gi de limite ; 1Gi convient à des nœuds de 2 Go.
  resources:
    requests:
      cpu: 250m
      memory: 384Mi
    limits:
      memory: 1Gi

  nodeSelector: {}
  tolerations: []
  affinity: {}

frontend:
  image:
    repository: registry.example.com/ecg-hub/frontend
    tag: "1.1.0"
    pullPolicy: IfNotPresent
  # Sans état : peut monter à 2 pour tolérer la perte d'un nœud.
  replicas: 1
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { memory: 128Mi }
  nodeSelector: {}
  tolerations: []
  affinity: {}

ingress:
  enabled: true
  className: ""
  host: ecg-hub.example.com
  annotations: {}
  # Vide si le contrôleur d'Ingress sert déjà le certificat (certificat par
  # défaut, wildcard). Sinon :
  #   - secretName: ecg-hub-tls
  #     hosts: [ecg-hub.example.com]
  tls: []

# Service des appareils — couche 4, jamais d'Ingress.
#
# LoadBalancer et pas NodePort : la plage NodePort (30000-32767) exclut 21 et
# 4242, et certains électrocardiographes composent le 21 sans être
# paramétrables.
#
# APRÈS DÉPLOIEMENT, dans Administration > Modules :
#   FTP    port 2121, Public host = loadBalancerIP, Public port 21,
#          plage passive = ftp.passive.start-end
#   DICOM  port 4242
#   ECTP   port 30003
devices:
  # Adresse à FIGER : les appareils sont configurés à la main avec elle. Vide,
  # le LoadBalancer en attribue une, qui peut changer. Posée sous forme
  # d'annotation MetalLB (metallb.io/loadBalancerIPs) ; pour un autre
  # fournisseur, laisser vide et passer son annotation dans `annotations`.
  loadBalancerIP: ""
  annotations: {}
  #   metallb.io/address-pool: default
  # Préserve l'adresse source de l'appareil, seule identité du client dans la
  # traçabilité d'ingestion. Avec MetalLB L2, l'adresse n'est annoncée que
  # depuis le nœud qui porte un pod prêt.
  externalTrafficPolicy: Local
  ftp:
    port: 21
    # Plage passive. Doit correspondre EXACTEMENT à celle du module FTP : le
    # serveur annonce un port dans sa réponse 227, et un port non publié fait
    # échouer le transfert. Sa largeur plafonne les transferts simultanés.
    # Un port déjà publié (ECTP 30003) est retiré de la liste automatiquement :
    # un doublon ferait refuser le Service ; le serveur FTP passe au suivant.
    passive:
      start: 30000
      end: 30100
  dicom:
    port: 4242
  ectp:
    port: 30003
  # HL7 ADT entrant (IHE RAD-12) : chemin d'écriture dans l'identité patient,
  # atteint par le réseau. Activer aussi adt dans config.yaml.
  adt:
    enabled: false
    port: 2576

persistence:
  # storageClass  PVC dynamiques (StorageClass vide = celle par défaut)
  # nfs           PV statiques + PVC liés, pour un cluster sans StorageClass
  # existingClaim PVC fournis par ailleurs
  # emptyDir      aucun volume persistant — refusé hors stockage S3. En S3 les
  #               volumes ne sont qu'une file d'attente avant téléversement :
  #               un fichier pas encore envoyé est PERDU si le pod disparaît
  #               pendant une coupure du bucket. `size` devient sizeLimit.
  mode: storageClass
  # Retain : un PV de données cliniques ne se recycle pas.
  reclaimPolicy: Retain
  ecg:
    size: 10Gi
    nfs:
      server: ""   # ex. nfs.example.com
      path: ""     # ex. /export/ecg-hub
    storageClass: ""
    existingClaim: ""
  quarantine:
    size: 2Gi
    nfs:
      server: ""   # ex. nfs.example.com
      path: ""     # ex. /export/ecg-hub
    storageClass: ""
    existingClaim: ""
