# Maps the Upgrade header so WebSocket connections proxy correctly while normal
# HTTP requests keep a standard (closed) Connection header.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # http2 enables h2c (HTTP/2 cleartext) so real gRPC clients can connect.
    # HTTP/1.1 clients (browser, REST, WebSockets, Connect-over-HTTP) still
    # negotiate HTTP/1.1 on the same port — they never send the h2c preface.
    listen 80 http2;
    server_name _;

    resolver 127.0.0.11 valid=5s ipv6=off;

    # Match the backend's Echo BodyLimit (10M) — largest expected upload is the
    # branding logo. Without this nginx would 413 at its 1m default.
    client_max_body_size 10m;

    # API → backend Go
    location /api/ {
        set $backend "backend:4444";
        proxy_pass http://$backend;
        proxy_set_header Host $host;

        # Client identity headers — required by the backend's per-IP login rate
        # limiting / lockout (c.RealIP()) and the cookie Secure flag (c.Scheme()).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade — required for export progress (/api/v1/exports/:id/ws).
        proxy_http_version 1.1;
        # Long-lived server streams (EventService.Subscribe) must reach the
        # browser frame by frame. With buffering on, nginx holds the response
        # until the handler returns — which for a stream is never — so the
        # upload page waits, times out and leaves its rows on "processing".
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
    }

    # gRPC → backend Go (h2c). A gRPC client sends the fully-qualified method
    # as the path (/<package>.<Service>/<Method>), e.g.
    # /grpc.api.v1.HealthzService/CheckHealth — so we match the package prefix,
    # NOT an invented /grpc/ prefix (a gRPC client can't add one).
    location /grpc.api.v1. {
        set $backend "backend:4444";
        grpc_pass grpc://$backend;
    }

    # Downloads — no cache to prevent 304 on blob fetch
    location ~ ^/api/v1/ecgs/.+/download {
        set $backend "backend:4444";
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache" always;
        add_header Pragma "no-cache" always;
    }

    location /swagger/ {
        set $backend "backend:4444";
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /metrics is served on backend:9091 (dedicated metrics port) — not proxied here.
    # Prometheus scrapes backend:9091 directly on the internal Docker network.

    # 👉 TOUT le reste → Vite dev server
    location / {
        set $frontend "frontend:5173";
        proxy_pass http://$frontend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
