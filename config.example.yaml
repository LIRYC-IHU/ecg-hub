# ECG Hub — config.yaml example.
# Copy to config.yaml. NEVER put secrets here — those live in .env.
#
# IMPORTANT: this file is INFRASTRUCTURE ONLY. Auth providers (OIDC/LDAP),
# ingestion modules (FTP/DICOM), HL7, outbound connectors and the webhook
# endpoints themselves are configured from the admin UI and stored in the
# database — they are NOT read from this file. The backend only parses the
# sections below.

server:
  # The listen port is fixed at 4444: the Dockerfile exposes it, nginx proxies
  # to it, and the compose stack binds it. Nothing to set here.
  #
  # tls: terminate TLS directly on the Go server (bare-metal). Behind nginx
  # (the default prod deployment) keep false — TLS terminates at the proxy.
  tls: false
  # cert_file: /etc/ecg-hub/certs/server.crt   # required when tls: true
  # key_file:  /etc/ecg-hub/certs/server.key   # required when tls: true

database:
  # The connection string is DATABASE_URL (in .env). These tune the pool only.
  max_open_conns: 10
  max_idle_conns: 5

storage:
  # Where ECG files live: "local" (default) or "s3".
  #
  # In s3 mode the local volume is still used, as a spool: files are written to
  # disk first and uploaded by a background worker, so ingestion never waits on
  # the network and a bucket outage costs a backlog instead of a lost ECG. Size
  # volume_path for the longest outage you are willing to ride out.
  backend: local
  # Mount point for the main ECG file volume.
  volume_path: /data/ecg
  # Separate volume for quarantined files (may need a different retention policy).
  quarantine_path: /data/ecg-quarantine
  # Soft cap on volume_path: oldest files are rotated out when exceeded.
  # Accepts Ki/Mi/Gi (binary) or k/m/g (decimal). Empty / "0" disables rotation
  # (not recommended in production).
  max_size: "50Gi"
  # Object storage — only read when backend is "s3". Credentials are NEVER in
  # this file: they come from S3_ACCESS_KEY and S3_SECRET_KEY in the
  # environment. Every field below also has an env override (S3_ENDPOINT,
  # S3_BUCKET, S3_REGION, S3_PREFIX, S3_PATH_STYLE) so an injected deployment
  # needs no templating of this file.
  #
  # Note: with backend "s3", max_size above stops being a rotation trigger and
  # becomes an alert on the upload backlog. Nothing on the volume is ever
  # deleted while it is the only copy of a record; retention on the bucket
  # belongs to its lifecycle rules.
  s3:
    # host[:port], or a full URL — its scheme then decides use_ssl.
    endpoint: ""
    bucket: ecg-hub
    region: ""
    # Optional key prefix, e.g. "prod/".
    prefix: ""
    use_ssl: true
    # Address buckets as <endpoint>/<bucket> instead of <bucket>.<endpoint>.
    # Required by MinIO, RustFS and Ceph unless wildcard DNS is set up.
    path_style: true
    # How often the spool is drained. Default 10.
    upload_interval_seconds: 10

# TLS certificate presented by the device-facing servers (FTPS, DICOM TLS).
#
# One pair for the installation, read from a mounted directory — there is no
# certificate field in the admin UI on purpose. Whoever already manages
# certificates (certbot, an internal PKI, a CHU wildcard) keeps managing them:
# the files are rewritten in place and the module is restarted, and nothing in
# the database ever holds a path.
#
# The defaults are certbot's filenames, so mounting
# /etc/letsencrypt/live/<host> at /certs needs no configuration at all.
# Overridable with TLS_CERT_FILE / TLS_KEY_FILE.
certs:
  cert_file: /certs/fullchain.pem
  key_file: /certs/privkey.pem

export:
  # Number of background export workers (PDF / FDA aECG / DICOM generation).
  workers: 2
  # How long generated export files are kept in the temp area before cleanup.
  tmp_ttl: 2h

# IHE — Information Source actor of the Retrieve ECG for Display profile
# (CARD-5, CARD-6 and the summary requestTypes of ITI-11).
#
# A second HTTP listener on its own port. It is NOT the API: these transactions
# carry no authentication of their own — the profile is from 2013 and expects
# security from a grouped ATNA actor — so they never share a middleware chain
# with the authenticated API, and the port is meant to be exposed to the DPI
# while /api stays behind nginx.
#
# mTLS is the only authentication this surface has, and the documents it serves
# carry the patient's name and identifier by specification (CARD TF-2
# §4.6.4.2.2.1 forbids anonymous ECG documents here). So cert_file, key_file and
# client_ca_file are all required when enabled is true, and the server refuses to
# start without them rather than falling back to anything.
#
# Certificates are read from mounted paths for the same reason as `certs` above:
# hospital IT already runs a PKI and renewal must stay upstream of the
# application.
ihe:
  enabled: false
  port: 8443
  # Empty binds every interface, which is the point here — the Display actor
  # lives on the site network. Narrow it if the DPI reaches a single address.
  host: ""
  # Certificate this listener presents to the Display.
  cert_file: /certs/ihe/server.pem
  key_file: /certs/ihe/server-key.pem
  # CA that signs the Display actors' client certificates. Without it there is
  # no mTLS, and without mTLS this is an open endpoint serving named patient
  # documents — hence a required field, never a default.
  client_ca_file: /certs/ihe/clients-ca.pem
  # The patient identifier domain this installation answers for, matched against
  # the assigning authority of the HL7 CX in a CARD-5 query. Set it on a
  # multi-site deployment: patients.patient_id is unique installation-wide with
  # no authority column, so two domains issuing the same number would silently
  # resolve to one person. Empty ignores the authority component.
  assigning_authority: ""
  # The site's wall clock, as an IANA name. A CARD-5 date bound that carries no
  # zone is read in it — which is what a Display sends, because it forwards the
  # time a clinician typed.
  #
  # Deliberately not the container's TZ: servers are usually left on UTC so
  # their logs are, while the times on screen are local. Left empty, a zone-less
  # bound is read in the process timezone — UTC in a container — and the window
  # is off by the site's offset, enough to hide the ECG that was being looked
  # for.
  timezone: "Europe/Paris"
