# Observability overlay — Prometheus, Grafana, cAdvisor, node-exporter.
#
#   docker compose -f docker-compose.yml -f docker-compose.metrics.yml up -d
#
# Everything binds 127.0.0.1: cAdvisor and node-exporter expose the whole host
# (processes, mounts, network) with no authentication, and Grafana ships with
# admin/admin. Reach them over an SSH tunnel, never by publishing these ports:
#
#   ssh -L 3000:localhost:3000 -L 9090:localhost:9090 <host>
#
# Requires METRICS_ENABLED=true on the backend, otherwise :9091 serves nothing.

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    networks: [ecg-hub]
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # A benchmark is read back sample by sample; the default 15d is more than
      # enough and keeps the volume small.
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./docs/grafana/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.5.1
    restart: unless-stopped
    networks: [ecg-hub]
    depends_on: [prometheus]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docs/grafana/provisioning:/etc/grafana/provisioning:ro
      # The dashboard provider reads /etc/grafana/provisioning/dashboards,
      # so the JSON has to land there and not next to it.
      - ./docs/grafana/ecg-hub-dashboard.json:/etc/grafana/provisioning/dashboards/ecg-hub-dashboard.json:ro
      - grafana-data:/var/lib/grafana

  # Per-container CPU, memory, network and disk. The dashboard keys every
  # container panel on the compose service label cAdvisor reads from Docker.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    restart: unless-stopped
    networks: [ecg-hub]
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  # Host-level CPU, memory and disk — what container metrics cannot show.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    networks: [ecg-hub]
    pid: host
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
    volumes:
      - /:/host:ro,rslave

volumes:
  prometheus-data:
  grafana-data:
