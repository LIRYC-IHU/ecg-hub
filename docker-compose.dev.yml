services:
  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_DB: ecghub
  #     POSTGRES_USER: ${DB_USER}
  #     POSTGRES_PASSWORD: ${DB_PASSWORD}
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ecghub"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LOG_LEVEL: debug
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY}
      APP_ENV: ${APP_ENV}
      # Same knobs as production: they override the metrics section of
      # config.yaml, so the scrape endpoint can move without editing the file.
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_PORT: ${METRICS_PORT:-9091}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      # IT: replace named volumes below with bind mounts to mount external storage, e.g.:
      - ./data/ecg:/data/ecg
      - ./data/ecg-quarantine:/data/ecg-quarantine
      - ./backend:/app
      # - ecg-storage:/data/ecg
      # - ecg-quarantine:/data/ecg-quarantine
    expose:
      - "4444"
      - "9091" # metrics scrape port (metrics.port in config.yaml)
    ports:
      - "${FTP_PORT:-2121}:2121" # Port FTP (le serveur écoute sur 2121 dans le conteneur)
      - "${DICOM_PORT:-4242}:4242" # Port Dicom
      - "30003:30003" # Port ECTP (Nihon Kohden)
      - "30000-30002:30000-30002" # FTP passive ports (range split around ECTP 30003)
      - "30004-30010:30004-30010" # FTP passive ports
      - "9091:9091"
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
volumes:
  # postgres-data:
  # IT: to use an external pre-created volume, replace with:
  #   ecg-storage:
  #     external: true
  #     name: my-ecg-volume
  ecg-storage:
  ecg-quarantine:
networks:
  default:
    name: dev-network
    external: true
