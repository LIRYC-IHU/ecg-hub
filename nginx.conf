server {
    listen 80;
    server_name _;

    # Use Docker's embedded DNS resolver with a short TTL so upstream hostnames
    # (backend) are resolved at request time, not at nginx startup.
    # This prevents [emerg] "host not found" when backend is still starting.
    resolver 127.0.0.11 valid=5s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to the Go backend.
    # Full path is preserved — backend routes are mounted at /api/v1/...
    location /api/ {
        set $backend "backend:4444";
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Proxy Swagger UI (public, no auth)
    location /swagger/ {
        set $backend "backend:4444";
        proxy_pass http://$backend/swagger/;
        proxy_set_header Host $host;
    }

    # React SPA — all other routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check passthrough
    location /healthz {
        set $backend "backend:4444";
        proxy_pass http://$backend/healthz;
        proxy_set_header Host $host;
    }
}
