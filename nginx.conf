# ECG Hub — production nginx (TLS termination).
#
# Certificates must be mounted into the container at the paths below, e.g.:
#   volumes:
#     - ./certs/server.crt:/etc/nginx/certs/server.crt:ro
#     - ./certs/server.key:/etc/nginx/certs/server.key:ro
# For local development without TLS, use nginx.dev.conf instead.

# --- HTTP : redirect everything to HTTPS ---
# Websocket/upgrade passthrough: send `Connection: upgrade` only when the client
# actually asked for one. Hardcoding it made every plain request carry an
# upgrade header the backend had to ignore, and killed upstream keepalive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Allow ACME HTTP-01 challenges (Let's Encrypt) without redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS : serve the SPA + proxy the API ---
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS — force HTTPS for one year, including subdomains (NFR-S1).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Use Docker's embedded DNS resolver with a short TTL so upstream hostnames
    # (backend) are resolved at request time, not at nginx startup.
    # This prevents [emerg] "host not found" when backend is still starting.
    resolver 127.0.0.11 valid=5s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to the Go backend.
    # Full path is preserved — backend routes are mounted at /api/v1/...
    location /api/ {
        set $backend "backend:4444";
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        # Long-lived server streams (EventService.Subscribe) must reach the
        # browser frame by frame. With buffering on, nginx holds the response
        # until the handler returns — which for a stream is never — so the
        # upload page waits, times out and leaves its rows on "processing".
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Proxy Swagger UI (public, no auth)
    location /swagger/ {
        set $backend "backend:4444";
        proxy_pass http://$backend/swagger/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React SPA — all other routes fall back to index.html.
    # CSP is applied here (HTML), NOT on /api/ or /swagger/ (Swagger UI needs inline assets).
    # nginx note: an add_header in a location replaces all parent add_headers,
    # so HSTS is re-declared here to keep it on SPA responses.
    location / {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
