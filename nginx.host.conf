# ECG Hub — production nginx for HOST networking (network_mode: host, Linux),
# behind an EXTERNAL Traefik reverse proxy that terminates TLS.
#
# TLS / Let's Encrypt is handled by Traefik on another machine. Traefik forwards
# requests here over plain HTTP (point its service at http://<this-host-ip>:80)
# and sets X-Forwarded-Proto=https, which we pass through to the backend so the
# app still sees the original scheme (secure cookies, absolute URLs, etc.).
#
# Difference from nginx.conf (bridge): there is no Docker embedded DNS in host
# mode, so the backend is reached on the host loopback at 127.0.0.1:4444 with a
# static upstream (no `resolver`, no service-name DNS).

# Websocket/upgrade passthrough: send `Connection: upgrade` only when the client
# actually asked for one. Hardcoding it made every plain request carry an
# upgrade header the backend had to ignore, and killed upstream keepalive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream ecg_backend {
    server 127.0.0.1:4444;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to the Go backend on the host loopback.
    location /api/ {
        proxy_pass http://ecg_backend;
        proxy_http_version 1.1;
        # Long-lived server streams (EventService.Subscribe) must reach the
        # browser frame by frame. With buffering on, nginx holds the response
        # until the handler returns — which for a stream is never — so the
        # upload page waits, times out and leaves its rows on "processing".
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
    }

    # Proxy Swagger UI (public, no auth)
    location /swagger/ {
        proxy_pass http://ecg_backend/swagger/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # React SPA — all other routes fall back to index.html.
    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
