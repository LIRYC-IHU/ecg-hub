# ECG Hub — production nginx for HOST networking (network_mode: host, Linux).
#
# Difference from nginx.conf (bridge): there is no Docker embedded DNS in host
# mode, so the backend is reached on the host loopback at 127.0.0.1:4444 with a
# static upstream (no `resolver`, no service-name DNS).
#
# Certificates are mounted at the paths below (see docker-compose.yml).

upstream ecg_backend {
    server 127.0.0.1:4444;
    keepalive 16;
}

# --- HTTP : redirect everything to HTTPS ---
server {
    listen 80;
    server_name _;

    # Allow ACME HTTP-01 challenges (Let's Encrypt) without redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS : serve the SPA + proxy the API ---
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS — force HTTPS for one year, including subdomains (NFR-S1).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to the Go backend on the host loopback.
    location /api/ {
        proxy_pass http://ecg_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Proxy Swagger UI (public, no auth)
    location /swagger/ {
        proxy_pass http://ecg_backend/swagger/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React SPA — all other routes fall back to index.html.
    location / {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }

    # Health check passthrough
    location /healthz {
        proxy_pass http://ecg_backend/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
